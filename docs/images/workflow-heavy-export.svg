<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 392" width="1140" height="392" role="img" aria-label="Handling heavy DIALux exports"><title>Handling heavy DIALux exports</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect width="1140" height="392" rx="16" fill="#0f172a"/><text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#e2e8f0" font-weight="700" text-anchor="start">Heavy DIALux exports: slim them down before working</text><text x="40" y="74" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">A raw DIALux DWG can hold hundreds of thousands of calculation objects, in metres. Work on a clean, millimetre copy.</text><rect x="40" y="110" width="245" height="190" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2"/><rect x="54" y="124" width="90" height="26" rx="13" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-width="1.2"/><text x="99.0" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#f87171" font-weight="600" text-anchor="middle">your file</text><text x="54" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="start">Raw export</text><text x="54" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">DLX_OBJ, DLX_CALC and</text><text x="54" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">DLX_APERT layers, 3D meshes,</text><text x="54" y="246" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">metres, own origin</text><line x1="287" y1="205" x2="305" y2="205" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="307" y="110" width="245" height="190" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><rect x="321" y="124" width="90" height="26" rx="13" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.2"/><text x="366.0" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#38bdf8" font-weight="600" text-anchor="middle">read-only</text><text x="321" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="start">Inspect first</text><text x="321" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">intake_scan or</text><text x="321" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">live_inventory: layers by</text><text x="321" y="246" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">weight, units, extent.</text><text x="321" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">Nothing is changed</text><line x1="554" y1="205" x2="572" y2="205" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="574" y="110" width="245" height="190" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/><rect x="588" y="124" width="90" height="26" rx="13" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.2"/><text x="633.0" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#34d399" font-weight="600" text-anchor="middle">copy only</text><text x="588" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="start">Slim copy</text><text x="588" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">dxf_sanitize or</text><text x="588" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">live_sanitize: strip heavy</text><text x="588" y="246" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">layers, scale to mm. Dry</text><text x="588" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">run, then explicit copy</text><line x1="821" y1="205" x2="839" y2="205" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="841" y="110" width="245" height="190" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><rect x="855" y="124" width="90" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="900.0" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">reviewable</text><text x="855" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="start">Align + import</text><text x="855" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">dialux_align (two points),</text><text x="855" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">dialux_import, verify per</text><text x="855" y="246" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">room</text><text x="40" y="340" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">The source file is hashed before and after: a sanitise never edits it, and refuses to overwrite a registered base.</text><text x="40" y="364" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">Status: built and tested on synthetic exports; not yet run on a real DIALux export.</text></svg>