<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 466" width="1140" height="466" role="img" aria-label="Floor-by-floor workflow with gates"><title>Floor-by-floor workflow with gates</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect width="1140" height="466" rx="16" fill="#0f172a"/><text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#e2e8f0" font-weight="700" text-anchor="start">A multi-floor project: one floor at a time, with gates</text><text x="40" y="74" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">The assistant works a floor, shows its count table, and does not start the next one until you confirm.</text><rect x="40" y="112" width="118" height="130" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/><circle cx="62" cy="136" r="12" fill="#34d399"/><text x="62" y="141" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">1</text><text x="99.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">Intake</text><text x="99.0" y="212" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#94a3b8" font-weight="400" text-anchor="middle">intake_scan</text><line x1="159" y1="177" x2="171" y2="177" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="172" y="112" width="118" height="130" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/><circle cx="194" cy="136" r="12" fill="#34d399"/><text x="194" y="141" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">2</text><text x="231.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">Slim the export</text><text x="231.0" y="212" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#94a3b8" font-weight="400" text-anchor="middle">dxf_sanitize</text><line x1="291" y1="177" x2="303" y2="177" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="304" y="112" width="118" height="130" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/><circle cx="326" cy="136" r="12" fill="#34d399"/><text x="326" y="141" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">3</text><text x="363.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">Working copy</text><text x="363.0" y="212" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#94a3b8" font-weight="400" text-anchor="middle">floor_from_base</text><line x1="423" y1="177" x2="435" y2="177" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="436" y="112" width="118" height="130" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><circle cx="458" cy="136" r="12" fill="#fbbf24"/><text x="458" y="141" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">4</text><text x="495.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">Open the floor</text><text x="495.0" y="212" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#94a3b8" font-weight="400" text-anchor="middle">plan_approve_floor</text><line x1="555" y1="177" x2="567" y2="177" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="568" y="112" width="118" height="130" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><circle cx="590" cy="136" r="12" fill="#a78bfa"/><text x="590" y="141" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">5</text><text x="627.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">Fill the table</text><text x="627.0" y="212" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#94a3b8" font-weight="400" text-anchor="middle">Excel table</text><line x1="687" y1="177" x2="699" y2="177" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="112" width="118" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="722" cy="136" r="12" fill="#38bdf8"/><text x="722" y="141" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">6</text><text x="759.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">Place + route</text><text x="759.0" y="212" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#94a3b8" font-weight="400" text-anchor="middle">place_from_table</text><line x1="819" y1="177" x2="831" y2="177" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="832" y="112" width="118" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="854" cy="136" r="12" fill="#38bdf8"/><text x="854" y="141" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">7</text><text x="891.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">Verify counts</text><text x="891.0" y="212" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#94a3b8" font-weight="400" text-anchor="middle">verify_placement</text><line x1="951" y1="177" x2="963" y2="177" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="964" y="112" width="118" height="130" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><circle cx="986" cy="136" r="12" fill="#fbbf24"/><text x="986" y="141" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">8</text><text x="1023.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">You confirm</text><text x="1023.0" y="212" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#94a3b8" font-weight="400" text-anchor="middle">plan_confirm_floor</text><path d="M1023.0 244 V280 H495.0 V246" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="700" y="302" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="400" text-anchor="middle">next floor: back to step 4</text><rect x="40" y="330" width="1060" height="112" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="60" y="362" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e2e8f0" font-weight="700" text-anchor="start">What the gates enforce</text><rect x="60" y="378" width="242" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="181.0" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">one floor open at a time</text><rect x="318" y="378" width="242" height="26" rx="13" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.2"/><text x="439.0" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle">base drawings never written</text><rect x="576" y="378" width="242" height="26" rx="13" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.2"/><text x="697.0" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#38bdf8" font-weight="600" text-anchor="middle">every change in work_log</text><rect x="834" y="378" width="242" height="26" rx="13" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.2"/><text x="955.0" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#34d399" font-weight="600" text-anchor="middle">counts per room must match</text><text x="60" y="430" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Your answers (floor order, scale, circuit scheme) are asked once, with defaults, and written into the plan.</text></svg>