<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 380" width="1140" height="380" role="img" aria-label="Live mode flow"><title>Live mode flow</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect width="1140" height="380" rx="16" fill="#0f172a"/><text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#e2e8f0" font-weight="700" text-anchor="start">Live mode: edit the open drawing while you chat</text><rect x="40" y="96" width="245" height="190" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><rect x="54" y="110" width="62" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="85.0" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">chat</text><text x="54" y="162" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="start">You say</text><text x="54" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">“Add a socket on the north</text><text x="54" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">wall of the Classroom on</text><text x="54" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">circuit GF-P02”</text><line x1="287" y1="191" x2="305" y2="191" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="307" y="96" width="245" height="190" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><rect x="321" y="110" width="62" height="26" rx="13" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.2"/><text x="352.0" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#38bdf8" font-weight="600" text-anchor="middle">MCP</text><text x="321" y="162" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="start">Tool call</text><text x="321" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">live_place → live_assign →</text><text x="321" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">live_route</text><line x1="554" y1="191" x2="572" y2="191" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="574" y="96" width="245" height="190" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/><rect x="588" y="110" width="62" height="26" rx="13" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.2"/><text x="619.0" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#34d399" font-weight="600" text-anchor="middle">COM</text><text x="588" y="162" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="start">AutoCAD</text><text x="588" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">symbol drawn on SOCKETS in</text><text x="588" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">your style, grouped as</text><text x="588" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">ACADE_&lt;id&gt;, one undo mark</text><line x1="821" y1="191" x2="839" y2="191" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="841" y="96" width="245" height="190" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><rect x="855" y="110" width="62" height="26" rx="13" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="1.2"/><text x="886.0" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a78bfa" font-weight="600" text-anchor="middle">screen</text><text x="855" y="162" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="start">You see it</text><text x="855" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">live_zoom shows the change.</text><text x="855" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">“Undo that” → live_undo</text><text x="855" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">reverts exactly that</text><text x="855" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">instruction</text><text x="40" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">Hand edits are respected: move a symbol in AutoCAD and the next call uses its real position.</text><text x="40" y="354" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">Illustrated flow. Windows + AutoCAD or AutoCAD Electrical running with a drawing open.</text></svg>