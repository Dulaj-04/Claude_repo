<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 724" width="1140" height="724" role="img" aria-label="Work plan coverage"><title>Work plan coverage</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect width="1140" height="724" rx="16" fill="#0f172a"/><text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#e2e8f0" font-weight="700" text-anchor="start">Your work plan: what the MCP covers today</text><text x="40" y="74" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">Honest status of each part of the electrical installation project plan.</text><rect x="40" y="96" width="1060" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="60" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="start">1</text><text x="100" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">Understand the building (CAD)</text><rect x="430" y="102" width="78" height="26" rx="13" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.2"/><text x="469.0" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#34d399" font-weight="600" text-anchor="middle">Built</text><text x="530" y="121" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">reads rooms, layers, units; never edits the reference</text><rect x="40" y="140" width="1060" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="60" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="start">2</text><text x="100" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">Load identification</text><rect x="430" y="146" width="78" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="469.0" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Partly</text><text x="530" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Excel load schedule + checks; you supply the loads</text><rect x="40" y="184" width="1060" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="60" y="209" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="start">3</text><text x="100" y="209" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">Lighting design</text><rect x="430" y="190" width="78" height="26" rx="13" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.2"/><text x="469.0" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#34d399" font-weight="600" text-anchor="middle">Built</text><text x="530" y="209" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">DIALux import, alignment, lighting schedule (lux stays in DIALux)</text><rect x="40" y="228" width="1060" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="60" y="253" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="start">4</text><text x="100" y="253" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">Socket outlet design</text><rect x="430" y="234" width="78" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="469.0" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Partly</text><text x="530" y="253" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">placement, circuits, routes, drawings; no socket load schedule yet</text><rect x="40" y="272" width="1060" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="60" y="297" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="start">5</text><text x="100" y="297" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">Maximum demand</text><rect x="430" y="278" width="78" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="469.0" y="296" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Partly</text><text x="530" y="297" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">connected + demand kW from YOUR factors; incomplete is flagged</text><rect x="40" y="316" width="1060" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="60" y="341" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="start">6</text><text x="100" y="341" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">Transformer selection</text><rect x="430" y="322" width="78" height="26" rx="13" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.2"/><text x="469.0" y="340" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle">Not yet</text><text x="530" y="341" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start"></text><rect x="40" y="360" width="1060" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="60" y="385" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="start">7</text><text x="100" y="385" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">Generator selection</text><rect x="430" y="366" width="78" height="26" rx="13" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.2"/><text x="469.0" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" font-weight="600" text-anchor="middle">Not yet</text><text x="530" y="385" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">essential-load total only</text><rect x="40" y="404" width="1060" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="60" y="429" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="start">8</text><text x="100" y="429" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">Three-phase distribution design</text><rect x="430" y="410" width="78" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="469.0" y="428" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Partly</text><text x="530" y="429" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">boards and circuits in the drawing; no phase balancing</text><rect x="40" y="448" width="1060" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="60" y="473" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="start">9</text><text x="100" y="473" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">Cable sizing</text><rect x="430" y="454" width="78" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="469.0" y="472" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Partly</text><text x="530" y="473" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Excel inputs + visible formulas; no calculation tool</text><rect x="40" y="492" width="1060" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="60" y="517" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="start">10</text><text x="100" y="517" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="start">Protection design</text><rect x="430" y="498" width="78" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="469.0" y="516" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="m