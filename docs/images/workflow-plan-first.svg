<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 440" width="1140" height="440" role="img" aria-label="Plan-first workflow"><title>Plan-first workflow</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect width="1140" height="440" rx="16" fill="#0f172a"/><text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#e2e8f0" font-weight="700" text-anchor="start">Plan-first workflow</text><text x="40" y="74" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">For anything bigger than one action, the assistant defines the goal first and asks you for exactly what it needs.</text><rect x="40" y="112" width="160" height="120" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><circle cx="66" cy="140" r="14" fill="#fbbf24"/><text x="66" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">1</text><text x="120.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">You ask</text><text x="120.0" y="210" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">a large request</text><line x1="202" y1="172" x2="216" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="218" y="112" width="160" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="244" cy="140" r="14" fill="#38bdf8"/><text x="244" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">2</text><text x="298.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Goal drafted</text><text x="298.0" y="210" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">plan_define</text><line x1="380" y1="172" x2="394" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="396" y="112" width="160" height="120" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><circle cx="422" cy="140" r="14" fill="#fbbf24"/><text x="422" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">3</text><text x="476.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">You approve</text><text x="476.0" y="210" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">plan_approve</text><line x1="558" y1="172" x2="572" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="574" y="112" width="160" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="600" cy="140" r="14" fill="#38bdf8"/><text x="600" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">4</text><text x="654.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Inputs requested</text><text x="654.0" y="210" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">plan_next</text><line x1="736" y1="172" x2="750" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="752" y="112" width="160" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="778" cy="140" r="14" fill="#38bdf8"/><text x="778" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">5</text><text x="832.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Steps run</text><text x="832.0" y="210" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">plan_update_step</text><line x1="914" y1="172" x2="928" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="930" y="112" width="160" height="120" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/><circle cx="956" cy="140" r="14" fill="#34d399"/><text x="956" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">6</text><text x="1010.0" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Checked output</text><text x="1010.0" y="210" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">validate / export</text><rect x="40" y="256" width="50" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="65.0" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">you</text><text x="98" y="275" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">decide and supply</text><rect x="260" y="256" width="86" height="26" rx="13" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.2"/><text x="303.0" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#38bdf8" font-weight="600" text-anchor="middle">assistant</text><text x="354" y="275" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">plans, checks, keeps the plan updated</text><rect x="40" y="304" width="1060" height="112" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="60" y="336" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#e2e8f0" font-weight="700" text-anchor="start">Inputs it can ask you for</text><rect x="60" y="352" width="242" height="26" rx="13" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.2"/><text x="181.0" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#34d399" font-weight="600" text-anchor="middle">files: drawings, DIALux export</text><rect x="318" y="352" width="242" height="26" rx="13" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="1.2"/><text x="439.0" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a78bfa" font-weight="600" text-anchor="middle">Excel sheets it creates for you</text><rect x="576" y="352" width="242" height="26" rx="13" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.2"/><text x="697.0" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">values with their source</text><rect x="834" y="352" width="242" height="26" rx="13" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.2"/><text x="955.0" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#38bdf8" font-weight="600" text-anchor="middle">decisions: circuits, DB location</text><text x="60" y="404" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">A step cannot finish while its inputs are missing or earlier steps are unfinished, and finishing records a result.</text></svg>