[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acad-electrical-mcp"
version = "0.1.0"
description = "MCP server for creating, revising, validating and exporting editable AutoCAD Electrical floor drawings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9,<2",
  "ezdxf>=1.3",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
autocad = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Dulaj-04/autocad-electrical-mcp"
Repository = "https://github.com/Dulaj-04/autocad-electrical-mcp"
Issues = "https://github.com/Dulaj-04/autocad-electrical-mcp/issues"

[project.scripts]
acad-electrical-mcp = "acad_electrical_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# explicit so local and CI always apply the same rules (ruff's defaults change between versions)
select = ["E4", "E7", "E9", "F", "I"]
